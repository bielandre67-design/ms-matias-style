<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho - MS</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="checkout-ms">

    <button type="button" class="voltar-checkout" onclick="voltarCheckoutMobile()">‹</button>

    <h2 id="tituloEtapa">Carrinho</h2>

    <div class="etapas">
      <span class="ativo" data-num="1">Carrinho</span>
      <span data-num="2">Entrega</span>
      <span data-num="3">Pagamento</span>
    </div>

    <section id="etapaCarrinho" class="etapa-checkout ativa">
      <div id="listaCarrinhoMobile"></div>

      <div class="resumo-checkout">
        <p><span>Subtotal</span><strong id="subtotal1">R$ 0,00</strong></p>
        <p><span>Total</span><strong id="total1">R$ 0,00</strong></p>
      </div>

     <button 
type="button"
class="btn-continuar"
onclick="irEntrega()">

Continuar

</button>

      <button class="btn-limpar" onclick="limparCarrinhoMobile()">
        Limpar carrinho
      </button>
    </section>

    <section id="etapaEntrega" class="etapa-checkout">
      <div class="entrega-box">
        <h3>Entrega</h3>

        <input type="text" id="nomeClienteMobile" placeholder="Seu nome completo">
        <input 
  type="tel"
  id="telefoneClienteMobile"
  placeholder="WhatsApp com DDD"
  maxlength="15"
  required
  oninput="formatarWhatsapp(this)"
>

        <div class="cep-box">
          <input type="text" id="cepCheckout" placeholder="Digite seu CEP">

          <button class="btn-frete" onclick="calcularFreteCheckout()">
            Calcular frete
          </button>
        </div>

        <div id="opcoesFreteCheckout"></div>

        <input type="text" id="ruaCliente" placeholder="Rua / Avenida">

        <div class="linha-endereco">
          <input type="text" id="numeroCasa" placeholder="Número">
          <input type="text" id="bairroCliente" placeholder="Bairro">
        </div>

        <input type="text" id="cidadeCliente" placeholder="Cidade">
      </div>

      <div class="resumo-checkout">
        <p><span>Subtotal</span><strong id="subtotalCheckout">R$ 0,00</strong></p>
        <p><span>Frete</span><strong id="freteResumo">R$ 0,00</strong></p>
        <p><span>Total</span><strong id="totalCheckout">R$ 0,00</strong></p>
      </div>

      <button type="button" class="btn-checkout" onclick="irPagamento()">
        Continuar para pagamento
      </button>
    </section>

   <section id="etapaPagamento" class="etapa-checkout">
  <div class="resumo-checkout">
    <h3>Resumo do pedido</h3>
    <div id="resumoPagamentoMobile"></div>

    <p>
      <span>Total</span>
      <strong id="totalPagamentoMobile">R$ 0,00</strong>
    </p>
  </div>

  <div class="pagamento-box">
    <h3>Pagamento</h3>
    <p>Você será redirecionado para o Mercado Pago para finalizar sua compra.</p>
  </div>

  <form id="formMercadoPago" action="http://localhost:3000/checkout-mp" method="POST">
  <input type="hidden" name="pedido" id="pedidoMercadoPago">

  <button
type="button"
id="btnFinalizarPagamento"
class="btn-finalizar"
>
Finalizar compra
</button>

<script>
function enviarMercadoPago(){
  const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
  const valorFrete = Number(localStorage.getItem("valorFreteMS")) || 0;

  document.getElementById("pedidoMercadoPago").value = JSON.stringify({
    items: carrinho,
    valorFrete: valorFrete
  });

  document.getElementById("formMercadoPago").submit();
}

document.getElementById("btnFinalizarPagamento").addEventListener("click", function(e){
  e.preventDefault();
  enviarMercadoPago();
});
</script>

</main>

<script src="script.js"></script>

<script>
async function pagarMercadoPago(event){
  event.preventDefault();
  event.stopPropagation();

  const carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
  const valorFrete = Number(localStorage.getItem("valorFreteMS")) || 0;

  if(carrinho.length === 0){
    alert("Carrinho vazio.");
    return false;
  }

  const resposta = await fetch("http://localhost:3000/criar-pagamento", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      items:carrinho,
      valorFrete:valorFrete
    })
  });

  const dados = await resposta.json();

  console.log("MERCADO PAGO:", dados);

  if(dados.init_point){
    window.location.href = dados.init_point;
    return false;
  }

  alert("Não veio link do Mercado Pago.");
  return false;
}
</script>

</body>
</html>
