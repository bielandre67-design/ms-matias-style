<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento não concluído | MS Matias Style</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font-family:Arial}.card{width:min(540px,100%);background:#121212;border:1px solid #2b2b2b;border-radius:22px;padding:34px;text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:24px;font-weight:900}.icon{font-size:52px;margin:22px}.pedido{background:#1c1c1c;border-radius:12px;padding:14px;margin:20px 0;font-weight:700}.btn{display:block;padding:15px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:12px}.principal{background:#fff;color:#000}.sec{border:1px solid #3b3b3b;color:#fff}</style><link rel="stylesheet" href="ms-icons.css">

</body></html>
