<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagamento confirmado | MS Matias Style</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#f7f7f7;font-family:Arial,Helvetica,sans-serif}
    .card{width:min(560px,100%);background:#121212;border:1px solid #2b2b2b;border-radius:22px;padding:34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .logo{width:78px;height:78px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:#f7f7f7;color:#090909;font-size:25px;font-weight:900;letter-spacing:-2px}
    .icon{font-size:54px;line-height:1;margin:8px 0 14px}.status{color:#bdbdbd;line-height:1.55}.pedido{margin:22px 0;padding:14px;border-radius:12px;background:#1a1a1a;font-weight:700}
    .btn{display:block;width:100%;padding:15px 18px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:12px}.principal{background:#fff;color:#090909}.secundario{border:1px solid #3b3b3b;color:#fff}
    .aguardando .icon{animation:pulse 1.2s infinite}@keyframes pulse{50%{transform:scale(.9);opacity:.55}}
  </style>
<link rel="stylesheet" href="ms-icons.css">
</head>
<body>
  <main class="card aguardando" id="card">
    <div class="logo">MS</div>
    <div class="icon" id="icone">⏳</div>
    <h1 id="titulo">Confirmando seu pagamento...</h1>
    <p class="status" id="mensagem">Estamos consultando o Mercado Pago. Esta tela será atualizada automaticamente.</p>
    <div class="pedido" id="pedidoBox">Pedido carregando...</div>
    <a class="btn principal" id="voltar" href="index.html" style="display:none">Voltar para a loja</a>
    <a class="btn secundario" href="index.html">Ir para a página inicial</a>
  </main>
<script>
(function(){
  const API='https://ms-matias-style.onrender.com';
  const p=new URLSearchParams(location.search);
  const pedido=p.get('pedido')||localStorage.getItem('msUltimoPedidoId');
  const box=document.getElementById('pedidoBox');
  box.textContent=pedido?'Pedido #'+pedido:'Número do pedido não encontrado';
  let tentativas=0;
  function aprovado(){
    document.getElementById('card').classList.remove('aguardando');
    document.getElementById('icone').textContent='✅';
    document.getElementById('titulo').textContent='Pagamento confirmado!';
    document.getElementById('mensagem').textContent='Recebemos seu pagamento. Seu pedido já entrou na fila de separação da MS Matias Style.';
    document.getElementById('voltar').style.display='block';
    ['carrinho','carrinhoMobile','carrinhoMS','valorFrete','valorFreteMS','freteSelecionadoMS'].forEach(k=>localStorage.removeItem(k));
  }
  function pendente(texto){
    document.getElementById('titulo').textContent='Pagamento ainda em confirmação';
    document.getElementById('mensagem').textContent=texto||'Assim que o Mercado Pago confirmar, esta tela mudará automaticamente.';
  }
  async function consultar(){
    if(!pedido){pendente('Não encontramos o número do pedido. Você pode voltar para a loja e conferir o painel de pedidos.');return;}
    tentativas++;
    try{
      const r=await fetch(API+'/pagamento/status/'+encodeURIComponent(pedido)+'?t='+Date.now(),{cache:'no-store'});
      const d=await r.json();
      const st=String(d.status||d.pagamento?.status||'').toLowerCase();
      if(st==='pago'||st==='approved'){aprovado();return;}
      if(['recusado','rejected','cancelado','cancelled'].includes(st)){
        location.replace('erro.html?pedido='+encodeURIComponent(pedido));return;
      }
      pendente(st==='pagamento em análise'?'O pagamento está em análise pelo Mercado Pago.':'A confirmação do PIX ainda está chegando. Não feche esta tela.');
    }catch(e){pendente('A confirmação está demorando um pouco, mas continuaremos tentando automaticamente.');}
    if(tentativas<90)setTimeout(consultar,2000);
  }
  consultar();
})();
</script>
<script src="ms-icons.js"></script>
</body>
</html>
