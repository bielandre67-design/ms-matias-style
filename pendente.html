<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pagamento pendente | MS Matias Style</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#fff;font-family:Arial}.card{width:min(540px,100%);background:#121212;border:1px solid #2b2b2b;border-radius:22px;padding:34px;text-align:center}.logo{width:76px;height:76px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#fff;color:#000;font-size:24px;font-weight:900}.icon{font-size:52px;margin:22px}.pedido{background:#1c1c1c;border-radius:12px;padding:14px;margin:20px 0;font-weight:700}.btn{display:block;padding:15px;border-radius:12px;background:#fff;color:#000;text-decoration:none;font-weight:800}</style><link rel="stylesheet" href="ms-icons.css">
</head><body><main class="card"><div class="logo">MS</div><div class="icon">⏳</div><h1>Pagamento pendente</h1><p>Seu pedido foi criado, mas o Mercado Pago ainda não confirmou o pagamento. A confirmação pode levar alguns instantes.</p><div class="pedido" id="pedido"></div><a class="btn" id="acompanhar">Acompanhar confirmação</a></main><script>const p=new URLSearchParams(location.search);const id=p.get('pedido')||localStorage.getItem('msUltimoPedidoId')||'';document.getElementById('pedido').textContent=id?'Pedido #'+id:'Pedido sem identificação';document.getElementById('acompanhar').href='sucesso.html?pedido='+encodeURIComponent(id);</script><script src="ms-icons.js"></script>
</body></html>
